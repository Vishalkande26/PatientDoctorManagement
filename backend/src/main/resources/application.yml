spring:

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=PatientManagementDB;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false
    username: patientapp
    password: Patient@123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-app-master.yaml

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0B