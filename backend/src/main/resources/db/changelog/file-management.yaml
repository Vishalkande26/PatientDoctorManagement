databaseChangeLog:

  - changeSet:
      id: file-management-001
      author: Vishal

      changes:

        - createTable:
            tableName: patient_files

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: original_file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: file_data
                  type: VARBINARY(MAX)
                  constraints:
                    nullable: false

              - column:
                  name: uploaded_at
                  type: DATETIME2
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME2
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: patient_files
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: FK_patient_files_patient
            onDelete: CASCADE